# =============================================================================
# rag.yaml  —  THE HEART OF THE LAB
# -----------------------------------------------------------------------------
# This single file decides WHICH RAG technique runs. Nothing else changes.
#
# THE WHOLE POINT:
#   flip one line here  ->  re-run the SAME eval suite  ->  measure the delta.
#   e.g. retrieval.mode: naive -> hybrid   gives you a real number like
#        "recall@5: 0.72 -> 0.91". That measured sentence is interview gold.
#
# Every switch below maps to a Strategy (behind a uniform interface) that we
# build in later boxes. Today the switches exist and are READ by the app on
# boot; the strategies they point at are filled in as we go. Frame first.
#
# RULE: this file is DATA, not logic. No behaviour is hardcoded in Python if it
# can be a readable switch here. That is what makes the experiment visible and
# lets the eval runner loop over many configs automatically later.
# =============================================================================

# ---- LLM: which brain answers --------------------------------------------------
llm:
  provider: ollama            # ollama (free, default for ALL experiments) | claude (paid, demo only)
  model: "llama3.1:8b"        # a placeholder local model; the real pick comes later
  temperature: 0.0            # 0 for grounded Q&A / anything code parses (Step 0/1)
  max_tokens: 1024

# ---- Embeddings: text -> meaning-vectors --------------------------------------
# MUST be multilingual (Arabic + English). Locked decision: BGE-M3 (or
# multilingual-e5), never English-only OpenAI alone. Same embedder must be used
# at ingest-time AND query-time or the points live on different maps (Step 6).
embeddings:
  provider: bge_m3            # bge_m3 | multilingual_e5 | (openai only if ever needed)
  provider_model: "bge-m3"    # the Ollama model tag pulled into the ollama box
  dimension: 1024             # BGE-M3 output size; the pgvector column MUST match this
  normalize: true             # unit-length vectors so cosine similarity behaves

# ---- Ingestion (Phase A, runs ONCE): how docs become searchable ---------------
ingestion:
  # NOTE: extraction is now AUTO-ROUTED per document (text-layer probe), so there's
  # no single 'extractor' switch — the router picks text_pdf vs image_ocr by what
  # each file actually is. ColPali will slot in as a second image strategy later.
  chunker: structure_aware    # structure_aware (never cut a table!) | naive (fixed-size, baseline)
  chunk_size: 800             # chars per chunk (tune later against evals)
  chunk_overlap: 100          # small overlap so ideas aren't sliced at the seam
  ocr_languages: "eng"        # tesseract langs for the image path; use "eng+ara" for the manga
                              # (requires the tesseract Arabic language pack in the app box)

# ---- Retrieval (Phase B, runs EVERY question): the swappable strategies --------
# THIS is the dial you'll turn most. Rollout order (cheap+broad -> expensive+specific):
#   naive -> hybrid -> (+rerank) -> (+query_transform) -> crag -> graph -> agentic
retrieval:
  mode: naive                 # naive | hybrid | crag | graph | agentic
  top_k: 5                    # how many chunks to bring back (3-5 to start; Step 6)

  # Query transform: fix the user's messy wording BEFORE searching.
  query_transform: none       # none | rewrite | hyde

  # Hybrid = dense (meaning) + BM25 (exact keyword), fused by RRF.
  # LOCKED: mandatory for Arabic (BM25 catches literal AR terms dense may smear).
  hybrid:
    bm25_enabled: true
    rrf_k: 60                 # the k in RRF: score = sum 1/(k+rank)

  # Rerank: slow, precise second pass. "retrieve wide, rerank narrow."
  rerank:
    enabled: false            # turn on AFTER measuring the hybrid baseline
    top_n: 5                  # keep this many after reranking the wider set

  # Expensive shapes — OFF by default. Turn on ONLY when an eval proves the need.
  graph:
    enabled: false            # GraphRAG: for "connect-the-dots" interlinked docs
  multimodal:
    enabled: false            # ColPali/page-image: only if text extraction provably fails
  agentic:
    enabled: false            # multi-step decompose->route->reflect loop; last resort

# ---- Eval targets: the finish line, copied from PRODUCT.md ---------------------
# These are the SAME numbers as PRODUCT.md Section 3. Written here so the eval
# runner (Step 8) can read them as pass/fail thresholds and the CI merge gate
# can enforce them. When these change, change PRODUCT.md too — keep them in sync.
evals:
  golden_set_path: "evals/golden_set.jsonl"
  thresholds:
    faithfulness: 0.95        # anti-hallucination (RAG-Triad groundedness)
    answer_relevance: 0.90
    recall_at_5: 0.90         # retrieval quality, measured separately from the LLM
    p95_latency_seconds: 5.0
    cost_per_question_usd: 0.05
  red_lines:
    max_latency_seconds: 15.0     # any single answer over this = failure, not slow success
    max_cost_per_question_usd: 0.15  # over this = strategy disqualified regardless of accuracy