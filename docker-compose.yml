# RAG Lab — the whole dev stack as one system.
# Run: `docker compose up`. All images pinned for reproducibility.
#
# Three services on one private network. They reach each other by service name:
#   web -> db      at host "db",     port 5432
#   web -> ollama  at "http://ollama:11434"

services:
  # --- PostgreSQL 16 with the pgvector extension baked in (our vector store) ---
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data     # data survives container restarts
    ports:
      - "5432:5432"                         # exposed so host tools can connect too
    healthcheck:                            # web waits until Postgres is truly ready
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Ollama: local LLM + embedding models ($0, no host install) ---
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - ollama_data:/root/.ollama           # downloaded models persist here
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis: Celery broker (+ result backend). Also our cache later (Phase 6). ---
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- The Django app (also the Celery PRODUCER: enqueues ingestion tasks) ---
  web:
    build: .
    env_file: .env
    volumes:
      - .:/app                              # live code reload during dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy          # don't start until Postgres is ready
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"

  # --- Celery worker (the CONSUMER): same image as web, different command. ---
  # Runs the ingestion pipeline off the queue so slow work never blocks a request.
  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app                              # same live code as web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    command: celery -A config worker --loglevel=info --concurrency=2

volumes:
  pgdata:
  ollama_data:
