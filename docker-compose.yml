# =============================================================================
# docker-compose.yml  —  the empty machine: 3 boxes that must boot and talk.
# -----------------------------------------------------------------------------
# Boxes:
#   db     -> Postgres + pgvector : the filing cabinet that can search vectors
#   ollama -> local AI brain      : runs open models for $0 (chat + embeddings)
#   app    -> your Django code    : orchestrates everything (empty today)
#
# Boxes find each other BY SERVICE NAME on the shared network:
#   app -> db      at host "db"     (NOT localhost — that means "this box")
#   app -> ollama  at "http://ollama:11434"
#
# Values with ${...} are read from .env (copy .env.example -> .env first).
# =============================================================================

services:

  # ---- Box 1: the vector-capable database ------------------------------------
  db:
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:-pg17-trixie}  # pinned, not `latest`
    container_name: rag_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # models/data survive `compose down`; without this you'd lose the DB
    healthcheck:
      # "is the DB actually ready?" — app waits for this before starting.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Box 2: the local llm ($0 dev) ------------------------------------
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: rag_lab_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"         # Ollama's API port
    volumes:
      - ollama_data:/root/.ollama  # pulled models are big; persist so you don't re-download every restart
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ---- Box 3: your app -------------------------------------------------------
  app:
    build: .                  # builds from the Dockerfile in this folder
    container_name: rag_lab_app
    restart: unless-stopped
    env_file: .env            # the app reads all its config from .env
    ports:
      - "8000:8000"           # Django dev server -> http://localhost:8000
    volumes:
      - .:/app                # live-mount your code so edits show without rebuilding (dev only)
    depends_on:
      db:
        condition: service_healthy   # don't start app until DB passes its healthcheck
      ollama:
        condition: service_healthy


# ---- Named volumes: durable storage that outlives containers -----------------
volumes:
  pgdata:
  ollama_data: